name: Auto Setup & Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter Android Project
        run: |
          flutter create --platforms=android --project-name notepad_app .

      - name: Generate pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: notepad_app
          description: "A lightweight .txt and .md notepad"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            file_picker: ^8.1.4
            shared_preferences: ^2.3.2
            flutter_markdown: ^0.7.4
            intl: ^0.19.0

          flutter:
            uses-material-design: true
          EOF

      - name: Generate lib/note_service.dart
        run: |
          cat << 'EOF' > lib/note_service.dart
          import 'dart:io';
          import 'package:file_picker/file_picker.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          class NoteItem {
            final String title;
            final String content;
            final String path;
            final DateTime lastModified;
            final bool isMarkdown;

            NoteItem({
              required this.title,
              required this.content,
              required this.path,
              required this.lastModified,
              required this.isMarkdown,
            });
          }

          class NoteService {
            static const String _folderKey = 'selected_workspace_folder';

            Future<String?> getSavedFolderPath() async {
              final prefs = await SharedPreferences.getInstance();
              return prefs.getString(_folderKey);
            }

            Future<String?> pickAndSaveDirectory() async {
              String? selectedDirectory = await FilePicker.platform.getDirectoryPath();
              if (selectedDirectory != null) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.setString(_folderKey, selectedDirectory);
                return selectedDirectory;
              }
              return null;
            }

            Future<List<NoteItem>> loadNotesFromDirectory(String folderPath) async {
              final dir = Directory(folderPath);
              if (!await dir.exists()) return [];

              final entities = dir.listSync();
              List<NoteItem> notes = [];

              for (var entity in entities) {
                if (entity is File &&
                    (entity.path.endsWith('.md') || entity.path.endsWith('.txt'))) {
                  try {
                    final content = await entity.readAsString();
                    final stat = await entity.stat();
                    final fileName = entity.uri.pathSegments.last;

                    notes.add(
                      NoteItem(
                        title: fileName,
                        content: content,
                        path: entity.path,
                        lastModified: stat.modified,
                        isMarkdown: entity.path.endsWith('.md'),
                      ),
                    );
                  } catch (_) {}
                }
              }

              notes.sort((a, b) => b.lastModified.compareTo(a.lastModified));
              return notes;
            }

            Future<File> saveNote({
              required String folderPath,
              required String fileName,
              required String content,
            }) async {
              final file = File('$folderPath/$fileName');
              return await file.writeAsString(content);
            }
          }
          EOF

      - name: Generate lib/editor_screen.dart
        run: |
          cat << 'EOF' > lib/editor_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter_markdown/flutter_markdown.dart';
          import 'note_service.dart';

          class EditorScreen extends StatefulWidget {
            final String folderPath;
            final NoteItem? note;

            const EditorScreen({super.key, required this.folderPath, this.note});

            @override
            State<EditorScreen> createState() => _EditorScreenState();
          }

          class _EditorScreenState extends State<EditorScreen> {
            final NoteService _noteService = NoteService();
            late TextEditingController _titleController;
            late TextEditingController _contentController;

            bool _isMarkdown = false;
            bool _isPreviewMode = false;
            Timer? _debounceTimer;

            final TextStyle _notepadFont = const TextStyle(
              fontFamily: 'monospace',
              fontSize: 15,
              height: 1.4,
            );

            @override
            void initState() {
              super.initState();
              _isMarkdown = widget.note?.isMarkdown ?? false;
              _titleController = TextEditingController(
                text: widget.note != null
                    ? widget.note!.title.replaceAll(RegExp(r'\.(md|txt)$'), '')
                    : 'untitled',
              );
              _contentController = TextEditingController(text: widget.note?.content ?? '');

              _contentController.addListener(_onTextChanged);
              _titleController.addListener(_onTextChanged);
            }

            void _onTextChanged() {
              _debounceTimer?.cancel();
              _debounceTimer = Timer(const Duration(milliseconds: 500), _saveNote);
            }

            Future<void> _saveNote() async {
              final title = _titleController.text.trim().isEmpty ? 'untitled' : _titleController.text.trim();
              final ext = _isMarkdown ? '.md' : '.txt';
              final fileName = '$title$ext';

              await _noteService.saveNote(
                folderPath: widget.folderPath,
                fileName: fileName,
                content: _contentController.text,
              );
            }

            @override
            void dispose() {
              _debounceTimer?.cancel();
              _titleController.dispose();
              _contentController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  titleSpacing: 0,
                  title: TextField(
                    controller: _titleController,
                    style: _notepadFont.copyWith(fontWeight: FontWeight.bold, fontSize: 16),
                    decoration: const InputDecoration(border: InputBorder.none, hintText: 'filename'),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        setState(() {
                          _isMarkdown = !_isMarkdown;
                          if (!_isMarkdown) _isPreviewMode = false;
                        });
                        _saveNote();
                      },
                      child: Text(_isMarkdown ? '.md' : '.txt', style: _notepadFont.copyWith(fontWeight: FontWeight.bold)),
                    ),
                    if (_isMarkdown)
                      IconButton(
                        icon: Icon(_isPreviewMode ? Icons.edit : Icons.visibility_outlined),
                        onPressed: () => setState(() => _isPreviewMode = !_isPreviewMode),
                      ),
                  ],
                ),
                body: _isPreviewMode
                    ? Markdown(
                        data: _contentController.text,
                        styleSheet: MarkdownStyleSheet.fromTheme(Theme.of(context)).copyWith(
                          p: _notepadFont,
                          code: _notepadFont.copyWith(backgroundColor: Colors.black12),
                        ),
                      )
                    : Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: TextField(
                          controller: _contentController,
                          maxLines: null,
                          expands: true,
                          autofocus: widget.note == null,
                          style: _notepadFont,
                          decoration: InputDecoration(
                            border: InputBorder.none,
                            hintText: 'Type your notes here...',
                            hintStyle: _notepadFont.copyWith(color: Colors.grey),
                          ),
                        ),
                      ),
              );
            }
          }
          EOF

      - name: Generate lib/main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'note_service.dart';
          import 'editor_screen.dart';

          void main() => runApp(const NotepadApp());

          class NotepadApp extends StatelessWidget {
            const NotepadApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Notepad',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.light,
                  scaffoldBackgroundColor: const Color(0xFFFBFBFB),
                  appBarTheme: const AppBarTheme(elevation: 0.5, backgroundColor: Color(0xFFF7F7F7)),
                ),
                darkTheme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF1E1E1E),
                  appBarTheme: const AppBarTheme(elevation: 0.5, backgroundColor: Color(0xFF252526)),
                ),
                themeMode: ThemeMode.system,
                home: const NotepadHomeScreen(),
              );
            }
          }

          class NotepadHomeScreen extends StatefulWidget {
            const NotepadHomeScreen({super.key});

            @override
            State<NotepadHomeScreen> createState() => _NotepadHomeScreenState();
          }

          class _NotepadHomeScreenState extends State<NotepadHomeScreen> {
            final NoteService _noteService = NoteService();
            String? _currentFolderPath;
            List<NoteItem> _notes = [];
            bool _isLoading = true;
            final TextStyle _mono = const TextStyle(fontFamily: 'monospace');

            @override
            void initState() {
              super.initState();
              _checkFolder();
            }

            Future<void> _checkFolder() async {
              setState(() => _isLoading = true);
              final path = await _noteService.getSavedFolderPath();
              if (path != null) {
                _currentFolderPath = path;
                _notes = await _noteService.loadNotesFromDirectory(path);
              }
              setState(() => _isLoading = false);
            }

            Future<void> _chooseFolder() async {
              final path = await _noteService.pickAndSaveDirectory();
              if (path != null) {
                setState(() => _currentFolderPath = path);
                _refreshNotes();
              }
            }

            Future<void> _refreshNotes() async {
              if (_currentFolderPath == null) return;
              setState(() => _isLoading = true);
              final notes = await _noteService.loadNotesFromDirectory(_currentFolderPath!);
              setState(() {
                _notes = notes;
                _isLoading = false;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('Notepad', style: _mono.copyWith(fontWeight: FontWeight.bold, fontSize: 18)),
                      if (_currentFolderPath != null)
                        Text(
                          _currentFolderPath!.split('/').last,
                          style: _mono.copyWith(fontSize: 11, color: Colors.grey),
                        ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.folder_open_outlined),
                      tooltip: 'Change Folder',
                      onPressed: _chooseFolder,
                    ),
                  ],
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : _currentFolderPath == null
                        ? Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(Icons.folder_outlined, size: 64, color: Colors.grey),
                                const SizedBox(height: 16),
                                Text('Select a folder to start', style: _mono),
                                const SizedBox(height: 16),
                                ElevatedButton.icon(
                                  onPressed: _chooseFolder,
                                  icon: const Icon(Icons.folder_open),
                                  label: Text('Select Folder', style: _mono),
                                ),
                              ],
                            ),
                          )
                        : _notes.isEmpty
                            ? Center(child: Text('Folder is empty.\nTap + to write a note.', textAlign: TextAlign.center, style: _mono))
                            : ListView.separated(
                                itemCount: _notes.length,
                                separatorBuilder: (_, __) => const Divider(height: 1),
                                itemBuilder: (context, index) {
                                  final note = _notes[index];
                                  return ListTile(
                                    title: Text(note.title, style: _mono.copyWith(fontWeight: FontWeight.w600)),
                                    subtitle: Text(
                                      '${DateFormat('yyyy-MM-dd HH:mm').format(note.lastModified)}  ${note.content.split('\n').first}',
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: _mono.copyWith(fontSize: 12),
                                    ),
                                    trailing: Text(
                                      note.isMarkdown ? '.md' : '.txt',
                                      style: _mono.copyWith(fontSize: 12, fontWeight: FontWeight.bold),
                                    ),
                                    onTap: () async {
                                      await Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => EditorScreen(folderPath: _currentFolderPath!, note: note),
                                        ),
                                      );
                                      _refreshNotes();
                                    },
                                  );
                                },
                              ),
                floatingActionButton: _currentFolderPath == null
                    ? null
                    : FloatingActionButton(
                        onPressed: () async {
                          await Navigator.push(
                            context,
                            MaterialPageRoute(builder: (_) => EditorScreen(folderPath: _currentFolderPath!)),
                          );
                          _refreshNotes();
                        },
                        child: const Icon(Icons.add),
                      ),
              );
            }
          }
          EOF

      - name: Commit All Generated Files Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generate Flutter Notepad files [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push skipped or not permitted, continuing to build APK"

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-App
          path: build/app/outputs/flutter-apk/app-release.apk
