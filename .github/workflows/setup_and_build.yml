name: Flutter CI and Android Build

on:
  push:
    branches:
      - main
      - master
      - 'manus/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/txt_md_launcher.svg -o assets/txt_md_launcher.png

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        run: flutter test --coverage

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notepad-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
