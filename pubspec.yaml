name: notepad_app
description: "A lightweight .txt and .md notepad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/txt_md_launcher.png
  adaptive_icon_background: "#0757E8"
  adaptive_icon_foreground: assets/txt_md_launcher.png

flutter:
  uses-material-design: true
